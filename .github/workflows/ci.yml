name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high   # falla si hay vulnerabilidades altas o críticas
  desplegar:
    needs: pruebas                       # solo corre si las pruebas pasaron
    if: github.event_name == 'push'      # nunca desde una solicitud de cambio
    runs-on: ubuntu-latest
    environment: produccion              # espera la aprobación de un revisor
    steps:
      - run: echo "Aquí iría el despliegue real"
